<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Páginas</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        iframe{
            width: 100%;
            height: 100vh;
        }
        header{
            background-color: antiquewhite;
            height: 30px;
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
        }
    </style>
</head>
<body>
    <header>
        <form action="#">
            <label for="link_pesquisa">Cole o link e pressione Ok</label>
            <input type="text" name="link_pesquisa" id="link_pesquisa">
            <button type="button" id="ok">ok</button>
        </form>
    </header>
    <main>
        <iframe id="frame_pagina" src="" frameborder="0">

        </iframe>
    </main>
</body>
<script>
    const link = document.querySelector("#link_pesquisa");
    const btn_ok = document.querySelector("#ok");
    const frame = document.querySelector("#frame_pagina");

    btn_ok.addEventListener("click", function(){
        frame.src = link.value
        document.body.contentEditable = true
    })
</script>
</html>
